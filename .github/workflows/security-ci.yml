name: Enterprise Security & Quality Assurance Gate

on:
  push:
    branches: [main, master, security-hardening]
  pull_request:
    branches: [main, master]

jobs:
  backend-security-and-tests:
    name: Backend Tests & Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        working-directory: ./backend
        env:
          ENVIRONMENT: development
          JWT_SECRET: test-secret-key-for-ci-minimum-32-characters-long
          GEMINI_API_KEY: ""
        run: |
          python -m pytest tests -v

  frontend-security-and-build:
    name: Frontend Lint, Typecheck & Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Lint Checks
        working-directory: ./frontend
        run: npm run lint

      - name: Run Production Bundle Build (TypeScript + Vite)
        working-directory: ./frontend
        run: npm run build

      - name: Audit NPM Dependencies for Vulnerabilities
        working-directory: ./frontend
        run: npm audit --audit-level=high
